name: build

# Сборка и тесты — на каждый пуш и запрос на слияние. Релиз с готовыми файлами для
# трёх систем — когда в репозиторий приходит тег вида v0.3.0 (или вручную).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Goflake-macos-arm64
          - os: windows-latest
            name: Goflake-windows-x64
          - os: ubuntu-latest
            name: Goflake-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

      # macOS: приложение Goflake.app (сборка и подпись «ad hoc» — в скрипте), в zip.
      # Секретов в этом шаге нет: здесь работает cargo со сборочными скриптами зависимостей.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          sh scripts/bundle-macos.sh
          ditto -c -k --keepParent dist/Goflake.app "${{ matrix.name }}.zip"

      # Windows: один goflake.exe в zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          Compress-Archive -Path target/release/goflake.exe -DestinationPath "${{ matrix.name }}.zip"

      # Linux: бинарник, значок и файл для меню приложений в tar.gz
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir stage
          cp target/release/goflake assets/goflake.desktop assets/goflake-256.png stage/
          tar -C stage -czf "${{ matrix.name }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # Подпись Developer ID и нотаризация macOS-сборки — отдельная задача: здесь нет ни checkout,
  # ни cargo, ни чужого кода (сборочные скрипты зависимостей работали в задаче build и сюда не
  # попадают). Берёт готовый неподписанный zip, подписывает и заменяет им артефакт. Не для
  # запросов на слияние и не для чужих веток; без секрета (форк) всё пропускается, остаётся
  # подпись «ad hoc». Системные программы вызываются по абсолютным путям.
  sign-macos:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    env:
      # только признак «секрет задан», сам секрет сюда не попадает
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - if: env.HAS_CERT == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Goflake-macos-arm64
      - name: Sign and notarize
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          ZIP=Goflake-macos-arm64.zip
          /usr/bin/ditto -x -k "$ZIP" .
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS=$(/usr/bin/uuidgen)
          echo "$CERT_P12" | /usr/bin/base64 --decode > "$RUNNER_TEMP/cert.p12"
          /usr/bin/security create-keychain -p "$KCPASS" "$KC"
          /usr/bin/security set-keychain-settings -lut 3600 "$KC"
          /usr/bin/security unlock-keychain -p "$KCPASS" "$KC"
          /usr/bin/security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC"
          /usr/bin/security list-keychains -d user -s "$KC" login.keychain-db
          # «усиленная среда выполнения» и метка времени обязательны для нотаризации; требование
          # по идентификатору не нужно: у подписи Developer ID оно привязано к команде
          /usr/bin/codesign --force --options runtime --timestamp -s "$SIGN_ID" Goflake.app
          rm "$ZIP"
          /usr/bin/ditto -c -k --keepParent Goflake.app "$ZIP"
          /usr/bin/xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID"             --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          /usr/bin/xcrun stapler staple Goflake.app
          rm "$ZIP"
          /usr/bin/ditto -c -k --keepParent Goflake.app "$ZIP"
      # Связка ключей с сертификатом не должна остаться на раннере, даже если шаг упал
      - name: Remove keychain
        if: always() && env.HAS_CERT == 'true'
        run: |
          /usr/bin/security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12"
      - if: env.HAS_CERT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Goflake-macos-arm64
          path: Goflake-macos-arm64.zip
          overwrite: true
          if-no-files-found: error

  # Релиз: только по тегу. Собирает файлы всех трёх сборок в один релиз на GitHub.
  # Задача подписи может быть пропущена (нет секретов) — тогда выпускается как есть.
  release:
    needs: [build, sign-macos]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success'
      && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show what is released
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
