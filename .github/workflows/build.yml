name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: target/release/snowdrift
          - os: windows-latest
            artifact: target/release/snowdrift.exe
          - os: ubuntu-latest
            artifact: target/release/snowdrift
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: snowdrift-${{ matrix.os }}
          path: ${{ matrix.artifact }}
